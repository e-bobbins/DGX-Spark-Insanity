# Recipe: nvidia/Qwen3.6-35B-A3B-NVFP4
# Default model for DGX Spark LLM Stack
# Optimized for agentic workloads on 128GB unified memory (Grace-Blackwell GB10)

# HuggingFace model identifier
# This is the actual model checkpoint that will be loaded
model_name: "nvidia/Qwen3.6-35B-A3B-NVFP4"

# vLLM image this model is validated against.
# Upstream cu130 track matches the DGX Spark's 580.x driver family
# (CUDA 13.0); NGC nvcr.io tags need newer drivers (measured: 26.04-py3
# -> 595.58, 26.10-py3 -> 615.71). PINNED BY DIGEST: validated on
# driver 580.178.04 (boots, correct flags, model loader runs).
# Command form: both image families need the literal "vllm serve" prefix
# (entrypoint is the vLLM CLI); handled by deploy.sh.
vllm_image: "vllm/vllm-openai@sha256:3dbe092ec5b2cef63b6104d33fa75d6ce53a7870962529ada69f78bbbc38e776"

# Minimum host NVIDIA driver for the pinned image (nvidia-smi version).
# 580.65 = floor of the R580 branch; deployment fails fast with a clear
# message if the host is older.
min_driver: "580.65"

# Model name as exposed through LiteLLM
# Clients will use this name to access the model
served_model_name: "qwen3.6-35b-a3b-nvfp4"

# Tool call parser for vLLM
# Confirmed real parser in current vLLM: qwen3_xml
tool_call_parser: "qwen3_xml"

# Reasoning parser for vLLM
# Confirmed real parser in current vLLM: qwen3
reasoning_parser: "qwen3"

# Maximum model length (context window)
# 262144 = 256K tokens
max_model_len: 262144

# GPU memory utilization
# Everything on GB10 shares one 128GB unified memory pool; vLLM over-
# allocates at its ~1.0 default and 0.8 OOMs under concurrency. 0.6 is the
# kit default (measured 0.4 = never-OOM conservative on this box; NVIDIA's
# 120B recipe uses 0.75). ~35GB weights + KV cache + host overhead.
gpu_memory_utilization: 0.6

# Maximum number of concurrent sequences
# Increased from default 6 to 15 for better throughput with agentic workloads
max_num_seqs: 15

# Shared memory for the vLLM container (--shm-size), in bytes or docker size
# notation. vLLM uses /dev/shm for activation buffers; raise if you see
# shm allocation errors under load.
shm_size: "16g"

# Enable automatic tool choice
# Allows vLLM to automatically select appropriate tools
enable_auto_tool_choice: true

# Trust remote code
# Required for some model functionalities
trust_remote_code: true

# Additional vLLM flags (optional)
# These will be passed directly to the vLLM command line
# Example:
#   --dump-config: false
#   --log-level: INFO
