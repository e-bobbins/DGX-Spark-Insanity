# Recipe: RedHatAI/Qwen3.6-35B-A3B-NVFP4
# Default model for DGX Spark LLM Stack
# Optimized for agentic workloads on 128GB unified memory (Grace-Blackwell GB10)
#
# Checkpoint note: the nvidia/ NVFP4 export of this model is a ModelOpt
# quantization (quantized lm_head + w1/w2/w3 input scales) that the pinned
# vLLM build cannot load (KeyError: layers.0.mlp.experts.w2_input_scale,
# vllm issues #44081/#45102, confirmed live on GB10). The RedHatAI export
# uses llm-compressor / compressed-tensors nvfp4-pack-quantized, which the
# same build loads and serves correctly (verified on GB10, driver
# 580.178.04: load, health 200, coherent generation).
# The nvidia ModelOpt path needed VLLM_MXFP4_BACKEND=marlin on GB10; the
# compressed-tensors path runs FlashInfer CUTLASS FP4 natively. That env
# was removed from deploy.sh.

# HuggingFace model identifier
# This is the actual model checkpoint that will be loaded
model_name: "RedHatAI/Qwen3.6-35B-A3B-NVFP4"

# Exact HF revision of the checkpoint (weights uploaded 6fca074; e94a930
# is the tested main snapshot). Passed as --revision: every node loads
# byte-identical weights.
revision: "e94a930"

# vLLM image this model is validated against.
# Upstream cu130 track matches the DGX Spark's 580.x driver family
# (CUDA 13.0); NGC nvcr.io tags need newer drivers (measured: 26.04-py3
# -> 595.58, 26.10-py3 -> 615.71). PINNED BY DIGEST: validated on
# driver 580.178.04 (boots, load_weights, health 200, generation OK).
vllm_image: "vllm/vllm-openai@sha256:3dbe092ec5b2cef63b6104d33fa75d6ce53a7870962529ada69f78bbbc38e776"

# Minimum host NVIDIA driver for the pinned image (nvidia-smi version).
# 580.65 = floor of the R580 branch; deployment fails fast with a clear
# message if the host is older.
min_driver: "580.65"

# Model name as exposed through LiteLLM
# Clients will use this name to access the model
served_model_name: "qwen3.6-35b-a3b-nvfp4"

# Tool call parser for vLLM
# Confirmed real parser in current vLLM: qwen3_xml
tool_call_parser: "qwen3_xml"

# Reasoning parser for vLLM
# Confirmed real parser in current vLLM: qwen3
reasoning_parser: "qwen3"

# Maximum model length (context window)
# 262144 = 256K tokens. NOTE: serving was verified at 131072; 262144 is
# the intended production setting but needs a boot re-check after the
# checkpoint switch (KV cache profiling happens at deploy time).
max_model_len: 262144

# GPU memory utilization
# Everything on GB10 shares one 128GB unified memory pool; vLLM over-
# allocates at its ~1.0 default and 0.8 OOMs under concurrency. 0.6 is the
# kit default (measured 0.4 = never-OOM conservative on this box).
gpu_memory_utilization: 0.6

# Maximum number of concurrent sequences
# Increased from default 6 to 15 for better throughput with agentic workloads
max_num_seqs: 15

# Shared memory for the vLLM container (--shm-size), in bytes or docker size
# notation. vLLM uses /dev/shm for activation buffers; raise if you see
# shm allocation errors under load.
shm_size: "16g"

# Enable automatic tool choice
enable_auto_tool_choice: true

# Trust remote code: NOT required for this checkpoint (loads and serves
# without it). Keeping it off closes an arbitrary-code surface.
trust_remote_code: false

# Additional vLLM serve flags passed to the container command.
# Whitespace split, single tokens only. --quantization selects the
# compressed-tensors loader for this checkpoint; --moe-backend picks the
# FlashInfer CUTLASS FP4 MoE kernel (verified working on GB10/sm_121).
extra_flags: "--quantization compressed-tensors --moe-backend flashinfer_cutlass"
