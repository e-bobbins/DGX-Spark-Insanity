# Docker Compose configuration for LiteLLM Hub.
# Consumed with: docker compose -f docker-compose.hub.yml --env-file secrets/hub.env up -d
#
# Image references and all secrets come from hub.env (generated by deploy.sh);
# DATABASE_URL is built there with the service hostname `postgres`.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: litellm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No ports published - only reachable via the bridge network

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.83.7-stable}
    container_name: litellm-proxy
    restart: unless-stopped
    user: "${SVC_UID:-1000}:${SVC_GID:-1000}"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL}
      STORE_MODEL_IN_DB: "True"
      LOG_LEVEL: ERROR
    env_file:
      - ${SECRETS_DIR}/hub.env
    volumes:
      - ${GENERATED_DIR}/litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "${NODE_IP}:${LITELLM_PORT:-4000}:4000"
    networks:
      llm-net:
        aliases:
          - litellm-service
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The LiteLLM image is python-slim with no curl; probe with python.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local

networks:
  llm-net:
    # Created by deploy.sh (docker network create) and shared with the
    # docker-run worker containers; compose must not manage its labels.
    external: true
    name: spark-kit-llm-net
