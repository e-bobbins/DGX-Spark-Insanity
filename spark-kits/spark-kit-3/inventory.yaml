# DGX Spark LLM Stack - Lab Inventory
# Single source of truth for the entire deployment
#
# deploy.sh reads this file AND writes each deployed node back into
# `nodes:` after a successful run. To move or re-role a node, deploy it
# again with the new answers; the entry here is updated automatically.
#
# Schema:
# - lab: Global lab settings (client subnets, NFS settings)
# - nodes: List of all nodes with their roles, IPs, and models
#
# Role definitions:
#   - hub:        Runs LiteLLM + Postgres
#   - worker:     Runs a vLLM worker
#   - hub+worker: Runs LiteLLM + Postgres AND a vLLM worker
#
# To add a new model: add a recipe file in recipes/, reference it by name
# in a node's model_recipe.

---

lab:
  # Client subnets that can reach the LiteLLM hub (CIDR notation).
  # Used as the default when deploy.sh prompts on a hub node, and for
  # firewall + NFS export rules.
  client_subnets: []

  # NFS model cache. OFF by default per spec; when enabled, the hub exports
  # export_path (root_squash, restricted to client subnets) and workers try
  # a read-only mount, falling back to independent downloads.
  nfs:
    enabled: false
    export_path: "/mnt/shared-models"
    server_ip: ""   # leave empty if same as hub

# Nodes in the lab. Populated by deploy.sh after each successful deploy.
# Format:
#   - node_id: spark-01
#     role: hub+worker
#     lan_ip: "10.0.0.30"
#     model_recipe: "qwen3.6-35b-a3b-nvfp4"   # null for hub-only nodes
nodes: []
