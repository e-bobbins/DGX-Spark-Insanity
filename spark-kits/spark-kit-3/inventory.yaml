# DGX Spark LLM Stack - Lab Inventory
# Single source of truth for the entire deployment
# 
# All configuration is generated from this file. Do not edit generated files directly.
#
# Schema:
# - lab: Global lab settings (client subnets, NFS settings)
# - nodes: List of all nodes with their roles, IPs, and models
#
# Role definitions:
#   - hub: Runs LiteLLM + Postgres (single node)
#   - worker: Runs vLLM worker
#   - hub+worker: Runs both LiteLLM + Postgres AND vLLM worker (hub's GPU not wasted)
#
# The deploy.sh script is fully interactive and will prompt you for all required
# information. This file serves as the central registry of all deployed nodes.
#
# To add a new node: add it to the nodes array below, then run deploy.sh on that machine.
# To modify configuration: run deploy.sh again, or edit this file and re-run.

---

# Global lab configuration
lab:
  # Client subnets that can reach the LiteLLM hub (CIDR notation)
  # These can also be specified interactively when running deploy.sh
  # Examples: ["10.0.0.0/24", "192.168.1.0/24"]
  client_subnets: []
  
  # NFS configuration (optional)
  nfs:
    enabled: true
    export_path: "/mnt/shared-models"
    # NFS server IP (leave empty if same as hub)
    server_ip: ""

# Nodes in the lab
# Add your nodes here as you deploy them
# Format:
#   - node_id: spark-01
#     role: hub+worker
#     lan_ip: "10.0.0.30"
#     model_recipe: "qwen3.6-35b-a3b-nvfp4"
nodes: []

# Model recipes configuration
# Each recipe defines how to serve a specific model
# Recipes are referenced by model_recipe field in nodes
recipes:
  # Default recipe for nvidia/Qwen3.6-35B-A3B-NVFP4
  qwen3.6-35b-a3b-nvfp4:
    hf_model_name: "nvidia/Qwen3.6-35B-A3B-NVFP4"
    served_model_name: "qwen3.6-35b-a3b-nvfp4"
    tool_call_parser: "qwen3_xml"
    reasoning_parser: "qwen3"
    max_model_len: 262144
    gpu_memory_utilization: 0.8
    max_num_seqs: 15
    enable_auto_tool_choice: true
    trust_remote_code: true
    
# Generated configuration (DO NOT EDIT DIRECTLY - generated by deploy script)
generated:
  hub_node: "spark-01"
  hub_lan_ip: "10.0.0.30"
  hub_port: 4000
  worker_children_hub: true
  model_groups:
    qwen3.6-35b-a3b-nvfp4:
      routes:
        - worker_id: spark-01
          api_base: "http://10.0.0.30:8000/v1"
          role: "hub+worker"
        - worker_id: spark-02
          api_base: "http://10.0.0.31:8000/v1"
          role: "worker"
        - worker_id: spark-03
          api_base: "http://10.0.0.32:8000/v1"
          role: "worker"
        - worker_id: spark-04
          api_base: "http://10.0.0.33:8000/v1"
          role: "worker"
        - worker_id: spark-05
          api_base: "http://10.0.0.34:8000/v1"
          role: "worker"
